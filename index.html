<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a1a" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>Voice Note to Text</title>
<style>
  :root {
    color-scheme: dark;
    --green: #22c55e;
    --light-green: #86efac;
    --red: #dc2626;
    --light-red: #fca5a5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; padding-bottom: 40px;
    background: #1a1a1a; color: #eee;
    font-family: -apple-system, system-ui, sans-serif;
    max-width: 560px; margin-inline: auto;
  }
  h1 { font-size: 1.1rem; font-weight: 600; color: #aaa; margin: 0 0 16px; }
  button {
    font: inherit; border: none; border-radius: 10px;
    padding: 14px 18px; font-size: 1rem; font-weight: 600;
    cursor: pointer; width: 100%; margin-top: 10px; color: #10251a;
  }
  button:disabled { opacity: 0.5; }
  .secondary { background: #2a2a2a; color: #eee; }
  .secondary:active { background: #383838; }
  .danger-text { color: #f87171; }

  #recordBtn { background: var(--green); font-size: 1.1rem; padding: 18px; }
  #pauseBtn { background: var(--light-red); display: none; }
  #resumeBtn { background: var(--light-green); display: none; }
  #stopBtn { background: var(--red); color: #2a0a0a; display: none; }
  .rec-row { display: flex; gap: 10px; }
  .rec-row button { margin-top: 0; }

  #status { color: #888; font-size: 0.9rem; margin-top: 10px; min-height: 1.2em; }
  #timer { font-variant-numeric: tabular-nums; color: #ef4444; font-weight: 600; display: none; margin-top: 8px; }
  #timer.show { display: block; }

  .mode-toggle { display: flex; gap: 8px; margin-top: 4px; }
  .mode-toggle button {
    margin-top: 0; flex: 1; background: #2a2a2a; color: #999; font-size: 0.85rem; padding: 10px;
  }
  .mode-toggle button.active { background: #333; color: #4ade80; border: 1px solid #4ade80; }

  label { display: block; color: #888; font-size: 0.85rem; margin: 20px 0 6px; }
  textarea {
    width: 100%; background: #111; color: #eee; border: 1px solid #333;
    border-radius: 8px; padding: 10px; font: inherit; font-size: 0.95rem;
    min-height: 100px; resize: vertical;
  }

  .numbers-group { margin-bottom: 12px; }
  .numbers-group h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 6px; }
  .numbers-group.confirmed h3 { color: #4ade80; }
  .numbers-group.unverified h3 { color: #f5a524; }
  .numbers-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .num-chip {
    background: #222; border-radius: 6px; padding: 4px 10px; font-size: 0.95rem;
    font-variant-numeric: tabular-nums;
  }
  .numbers-group.confirmed .num-chip { border-left: 3px solid #4ade80; }
  .numbers-group.unverified .num-chip { border-left: 3px solid #f5a524; }

  .row { display: flex; gap: 10px; }
  .row button { margin-top: 0; }

  #historyPanel {
    display: none; margin-top: 16px; border-top: 1px solid #333; padding-top: 12px;
  }
  #historyPanel.show { display: block; }
  .history-actions { display: flex; gap: 8px; margin-bottom: 12px; }
  .history-actions button { margin-top: 0; font-size: 0.85rem; padding: 10px; }
  .history-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #222; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    cursor: pointer;
  }
  .history-item:active { background: #2a2a2a; }
  .history-item .meta { flex: 1; overflow: hidden; }
  .history-item .date { font-size: 0.75rem; color: #888; }
  .history-item .preview { font-size: 0.9rem; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-item .del { color: #ef4444; font-weight: 700; padding: 4px 10px; margin-left: 8px; }
  #emptyHistory { color: #666; font-size: 0.9rem; }
  #importFile { display: none; }
</style>
</head>
<body>
  <h1>Voice Note → Text</h1>

  <div class="mode-toggle">
    <button id="modeFast" data-mode="fast">Fast</button>
    <button id="modeAccurate" data-mode="accurate">Accurate</button>
  </div>

  <button id="recordBtn">Start Recording</button>
  <div class="rec-row">
    <button id="pauseBtn">Pause</button>
    <button id="resumeBtn">Resume</button>
    <button id="stopBtn">Stop</button>
  </div>
  <div id="timer">0:00</div>
  <div id="status">Tap to record. First use downloads the offline speech model (one time, needs Wi-Fi).</div>

  <label for="transcript">Transcript (edit as needed)</label>
  <textarea id="transcript" placeholder="Transcript will appear here..."></textarea>

  <label>Numbers found</label>
  <div id="numbers">—</div>

  <label for="summary">Message to send</label>
  <textarea id="summary" placeholder="Edit this into the message you want to send..."></textarea>

  <div class="row">
    <button id="shareBtn" class="secondary">Share</button>
    <button id="copyBtn" class="secondary">Copy</button>
  </div>
  <div class="row">
    <button id="saveBtn" class="secondary">Save as .txt</button>
    <button id="historyBtn" class="secondary">Previous Notes</button>
  </div>

  <div id="historyPanel">
    <label style="margin-top:0">Previous notes</label>
    <div class="history-actions">
      <button id="exportBtn" class="secondary">Export All (JSON)</button>
      <button id="importBtn" class="secondary">Import</button>
      <button id="clearAllBtn" class="secondary danger-text">Clear All</button>
    </div>
    <input type="file" id="importFile" accept="application/json" />
    <div id="historyList"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
